<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-label="troubleshooting-workflow.svg"><rect width="1200" height="450" rx="20" fill="#0b1220"/><text x="43" y="53" fill="#f8fafc" font-size="24" font-weight="700" font-family="Arial, sans-serif" text-anchor="start">MY TROUBLESHOOTING METHOD</text><rect x="40" y="98" width="360" height="117" rx="14" fill="#15253a" stroke="#35516f"/><text x="62" y="135" fill="#5eead4" font-size="20" font-weight="700" font-family="Arial, sans-serif" text-anchor="start">01</text><text x="110" y="136" fill="#f8fafc" font-size="23" font-weight="700" font-family="Arial, sans-serif" text-anchor="start">Observe</text><text x="62" y="176" fill="#cbd5e1" font-size="17" font-weight="400" font-family="Arial, sans-serif" text-anchor="start">Capture the exact error</text><path d="M403 153 L425 153" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/><circle cx="425" cy="153" r="4" fill="#5eead4"/><rect x="430" y="98" width="360" height="117" rx="14" fill="#15253a" stroke="#35516f"/><text x="452" y="135" fill="#5eead4" font-size="20" font-weight="700" font-family="Arial, sans-serif" text-anchor="start">02</text><text x="500" y="136" fill="#f8fafc" font-size="23" font-weight="700" font-family="Arial, sans-serif" text-anchor="start">Inspect</text><text x="452" y="176" fill="#cbd5e1" font-size="17" font-weight="400" font-family="Arial, sans-serif" text-anchor="start">Check state and configuration</text><path d="M793 153 L815 153" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/><circle cx="815" cy="153" r="4" fill="#5eead4"/><rect x="820" y="98" width="360" height="117" rx="14" fill="#15253a" stroke="#35516f"/><text x="842" y="135" fill="#5eead4" font-size="20" font-weight="700" font-family="Arial, sans-serif" text-anchor="start">03</text><text x="890" y="136" fill="#f8fafc" font-size="23" font-weight="700" font-family="Arial, sans-serif" text-anchor="start">Hypothesize</text><text x="